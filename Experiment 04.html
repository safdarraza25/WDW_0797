<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <h1 align="center">Hotel Room Booking Form</h1>
    <fieldset>
    <legend><b>Personal Info</b></legend>
    <form action="#" method="post">

        <!-- Name -->
         <label for="fullname">Full Name:</label>
         <input type="text" id="fullname" name="fullname" required>
        <br><br> 
    
        <!-- Email -->
         <label for="email">Email:</label>
         <input type="email" id="email" name="email" required> 
        <br><br>

        <!-- Phone -->
         <label for="phone">Phone:</label>
         <input type="phone" id="phone" name="phone" required>
    </fieldset>
    <br><br>

    <fieldset>
    <legend><b>Booking Details</b></legend>
        <!-- Check-in Date -->
         <label for="checkin">Check-in Date:</label>
         <input type="date" id="checkin" name="checkin" required>
        <br><br>
        
        <!-- Check-out Date -->
         <label for="checkout">Check-out Date:</label>
         <input type="date" id="checkout" name="checkout" required>
        <br><br>

        <!-- Number of Guests -->
         <label for="guests">Number of Guests:</label>
         <input type="number" id="guests" name="guests" min="1" max="4" required>
        <br><br>

        <!-- Room Type -->
         <label for="roomtype">Room Type:</label>
         <select id="roomtype" name="roomtype" required>
            <option value="">Select a room type</option>
            <option value="single non-ac">Single Bed (Non-AC)</option>
            <option value="double non-ac">Double Bed (Non-AC)</option>
            <option value="single ac">Single Bed (AC)</option>
            <option value="double ac">Double Bed (AC)</option>
            <option value="suite">Suite</option>
         </select>
    </fieldset>
    <br><br>

    <fieldset>
    <legend><b>Additional Requests</b></legend>
        <!-- Special Requests -->
         <label for="requests">Special Requests:</label>
         <br>
         <textarea id="requests" name="requests" rows="4" cols="50"></textarea>
    </fieldset>
        <br>
        
        <!-- Book Button -->
        <button type="submit">Book Now</button>

        <!-- Reset Button -->
        <button type="reset">Reset Form</button>
    </form>

</body>
</html>
