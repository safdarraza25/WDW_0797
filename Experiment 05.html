<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1 align="center"><b>Student Registration Form</b></h1>
    <hr>

    <form action="#" method="post">
   
      <!-- Name -->
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      <br><br>

      <!-- Email -->
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter valid email address" required>
      <br><br>

      <!-- Password -->
      <label for="password">Password:</label>
      <input type="text" id="password" name="password" placeholder="Enter Password" required>
      <br><br>

      <!-- Gender -->
      <label for="gender">Gender:</label>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label>
      <input type="radio" id="other" name="gender" value="other">
      <label for="other">Other</label>
      <br><br>

      <!-- Course -->
      <label for="course">Course:</label>
      <select id="course" name="course" required>
         <option value="">-- Select Course --</option>
         <option value="btech">B.Tech</option>
         <option value="bca">BCA</option>
         <option value="mca">MCA</option>
         <option value="mtech">M.Tech</option>
      </select>
      <br><br>

      <!-- Contact No -->
      <label for="number">Contact No:</label>
      <input type="tel" id="number" name="number" placeholder="Enter phone number" required>
      <br><br>

      <!-- Address -->
      <label for="address">Address:</label>
      <br>
      <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea>
      <br><br>

      <!-- Register Button -->
      <input type="submit" value="Register">

      <!-- Clear Button -->
      <input type="reset" value="Clear">

    </form>
    
    <hr>
    <p align="center">&copy; 2026 Student Registration Portal</p>
    
</body>
</html>
